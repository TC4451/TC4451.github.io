short_bio: >-
  <p>
    I am a master's student in Computational Science and Engineering at
    <a href="https://www.harvard.edu/" target="_blank">Harvard University</a>, supported by the
    Amazon Robotics Day One Fellowship, and I am doing my master's thesis with
    Prof. <a href="https://marks.hms.harvard.edu/" target="_blank">Debora Marks</a> at Harvard Medical School.
  </p>

  <p>
    My research is in <strong>AI for science</strong>, especially <strong>generative models for molecular design in biology</strong>.
    I currently build foundation-model-based methods to design RNA that binds target proteins. Before that, I pretrained
    protein language models for antibody discovery at <a href="https://www.pfizer.com/" target="_blank">Pfizer</a>.
    Earlier, I worked on world models for robotics, computer vision, and soft robotics at Harvard, CMU, and WPI.
  </p>

  <p style="color: #a51c30; font-weight: bold;">
    I am applying to Ph.D. programs for Fall 2027.
  </p>

